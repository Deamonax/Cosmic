version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobfit
      POSTGRES_PASSWORD: jobfit
      POSTGRES_DB: jobfit
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://jobfit:jobfit@db:5432/jobfit
      USE_LIVE_OPENAI: "false"
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

volumes:
  db-data:
